<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 橙色圆角背景 -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#ff9f43"/>
  <!-- 白色相框 -->
  <rect x="20" y="20" width="60" height="60" rx="5" fill="none" stroke="white" stroke-width="6"/>
  <!-- 山 -->
  <polygon points="30 70, 50 45, 70 70" fill="white"/>
  <!-- 太阳 -->
  <circle cx="65" cy="35" r="8" fill="white"/>
</svg>
