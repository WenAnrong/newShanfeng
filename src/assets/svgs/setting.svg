<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 灰色圆角背景 -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#7f8c8d"/>
  <!-- 白色齿轮 -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="white" stroke-width="8"/>
  <circle cx="50" cy="50" r="8" fill="white"/>
  <!-- 齿轮齿 -->
  <rect x="45" y="15" width="10" height="15" fill="white"/>
  <rect x="45" y="70" width="10" height="15" fill="white"/>
  <rect x="15" y="45" width="15" height="10" fill="white"/>
  <rect x="70" y="45" width="15" height="10" fill="white"/>
  <rect x="25" y="25" width="12" height="12" fill="white" transform="rotate(45 31 31)"/>
  <rect x="63" y="25" width="12" height="12" fill="white" transform="rotate(45 69 31)"/>
  <rect x="25" y="63" width="12" height="12" fill="white" transform="rotate(45 31 69)"/>
  <rect x="63" y="63" width="12" height="12" fill="white" transform="rotate(45 69 69)"/>
</svg>
