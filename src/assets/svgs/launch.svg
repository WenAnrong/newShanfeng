<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 浅灰色圆角背景（mac风格） -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#d1d1d6"/>
  
  <!-- 3x3 应用网格，每个小方块带圆角 -->
  <!-- 第一行 -->
  <rect x="18" y="18" width="18" height="18" rx="4" fill="#ff6b6b"/>
  <rect x="41" y="18" width="18" height="18" rx="4" fill="#ff9f43"/>
  <rect x="64" y="18" width="18" height="18" rx="4" fill="#feca57"/>
  
  <!-- 第二行 -->
  <rect x="18" y="41" width="18" height="18" rx="4" fill="#54a0ff"/>
  <rect x="41" y="41" width="18" height="18" rx="4" fill="#5f27cd"/>
  <rect x="64" y="41" width="18" height="18" rx="4" fill="#1dd1a1"/>
  
  <!-- 第三行 -->
  <rect x="18" y="64" width="18" height="18" rx="4" fill="#f368e0"/>
  <rect x="41" y="64" width="18" height="18" rx="4" fill="#00d2d3"/>
  <rect x="64" y="64" width="18" height="18" rx="4" fill="#f8a5c2"/>
</svg>